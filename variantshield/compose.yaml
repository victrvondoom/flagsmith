# VariantShield alongside an EXISTING self-hosted Flagsmith (see docs/guides/SELF_HOSTING.md).
# To start Flagsmith too, use:  docker compose -f compose.with-flagsmith.yaml up --build
# Not exercised in the authoring sandbox (no Docker daemon): see docs/guides/SELF_HOSTING.md "Verification status".
services:
  variantshield:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      # Reaches a Flagsmith published on the Docker host; override FLAGSMITH_URL in .env for anything else.
      FLAGSMITH_URL: ${FLAGSMITH_URL:-http://host.docker.internal:8000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8787:8787"]
    volumes: [variantshield-data:/data]
  checkout-demo:
    build: .
    restart: unless-stopped
    command: ["node", "apps/checkout-demo/src/main.ts"]
    env_file: .env
    environment:
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: 8791
      DEMO_ALLOW_UID_HEADER: "true"
      FLAGSMITH_URL: ${FLAGSMITH_URL:-http://host.docker.internal:8000}
      VARIANTSHIELD_URL: http://variantshield:8787
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8791:8791"]
    depends_on: { variantshield: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  variantshield-data:
