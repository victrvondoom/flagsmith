# VariantShield plus a local self-hosted Flagsmith using Flagsmith's own published images, mirroring the
# official docker-compose.yml in https://github.com/Flagsmith/flagsmith (no Flagsmith code is copied or modified).
# Local evaluation only: change every secret before exposing anything. Not exercised in the authoring sandbox.
include:
  - compose.yaml
x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: "true"
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: "*"
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: change-me-local-only
  WAREHOUSE_CREDENTIALS_SECRET: change-me-local-only
  EXPERIMENTATION_ENABLED: "true"
services:
  postgres:
    image: postgres:15.5-alpine
    environment: { POSTGRES_PASSWORD: password, POSTGRES_DB: flagsmith }
    volumes: [flagsmith-pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -d flagsmith -U postgres"], interval: 2s, timeout: 2s, retries: 20, start_period: 20s }
  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    command: [migrate]
    environment: *flagsmith-env
    healthcheck: { disable: true }
    depends_on: { postgres: { condition: service_healthy } }
  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    command: [serve]
    environment: *flagsmith-env
    ports: ["8000:8000"]
    depends_on: { migrate-db: { condition: service_completed_successfully } }
volumes:
  flagsmith-pgdata:
