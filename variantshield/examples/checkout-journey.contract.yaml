# Example cross-surface experiment contract. See docs/guides/CONTRACTS.md.
contract:
  id: checkout-journey
  version: 1
  description: UPI-first checkout must be implemented consistently by web, mobile, payments and risk.

experiment:
  key: checkout_journey
  assignment_flag: checkout_journey_variant   # the Flagsmith multivariate flag that assigns the variant
  environment: production
  # environment_fingerprint: 0123456789abcdef  # optional pin; get it with `variantshield env-fingerprint <client key>`
  # flagsmith_experiment_id: 7                 # optional link to the Flagsmith experiment

identity:
  strategy: canonical_subject_id
  require_same_subject: true

surfaces:
  - id: web-checkout
    domain: checkout
    features: [checkout_ui]
  - id: mobile-checkout
    domain: checkout
    features: [checkout_ui]
  - id: payment-api
    domain: payments
    features: [payment_route]
  - id: risk-engine
    domain: risk
    features: [retry_policy]

variants:
  control:
    checkout_ui: classic
    payment_route: legacy
    retry_policy: standard
  upi_first:
    checkout_ui: upi_first
    payment_route: upi_intent_v2
    retry_policy: bounded

constraints:
  - id: upi-needs-v2-route
    when:
      checkout_ui: upi_first
    requires:
      payment_route: upi_intent_v2
      retry_policy: bounded
    message: The UPI-first UI is only safe with the v2 UPI intent route and bounded retries.
  - id: classic-never-uses-upi-route
    when:
      checkout_ui: classic
    forbids:
      payment_route: upi_intent_v2

freshness:
  max_age_seconds: 900
  correlation_window_seconds: 3600
  missing_surface_grace_seconds: 120

guardrails: [payment_failure_rate, duplicate_submission_rate, http_5xx_rate, checkout_p95_latency_ms]
